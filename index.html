<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konten AI Studio - Aji Pramana</title>
<style>
body{font-family:sans-serif;background:#f0fdf4;margin:0;padding:15px}
.card{background:white;max-width:600px;margin:auto;padding:20px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
h1{font-size:22px;text-align:center}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:14px;background:#111;color:white;border:none;border-radius:12px;font-size:16px;font-weight:bold}
button:disabled{opacity:0.5}
#hasil{background:#ecfdf5;padding:15px;border-radius:12px;margin-top:15px;white-space:pre-wrap;min-height:100px}
.copyBtn{background:#16a34a;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>✨ Konten AI Studio<br><span style="font-size:14px;font-weight:normal">Untuk Aji Pramana & Family</span></h1>
<label>🔑 Kunci API Gemini Kamu:</label>
<input type="password" id="apiKey" placeholder="Paste AIza... kamu di sini">
<label>Topik Konten:</label>
<input type="text" id="topik" placeholder="Contoh: Menjadi operator cleaning service yang Allah ridhoi">
<label>Platform:</label>
<select id="platform"><option>TikTok</option><option>Youtube Shorts</option><option>Instagram Reels</option><option>Facebook</option></select>
<button id="btn" onclick="buat()">Buat Caption AI Beneran ✨</button>
<div id="hasil">Hasil AI beneran akan muncul di sini...</div>
<button class="copyBtn" onclick="salin()">📋 Salin Caption</button>
</div>
<script>
let keyInput=document.getElementById('apiKey');
keyInput.value=localStorage.getItem('gemini_key')||'';
keyInput.oninput=()=>localStorage.setItem('gemini_key',keyInput.value);
async function buat(){
let key=keyInput.value.trim();
let topik=document.getElementById('topik').value.trim();
let platform=document.getElementById('platform').value;
let hasil=document.getElementById('hasil');
let btn=document.getElementById('btn');
if(!key){alert('Paste dulu Kunci API Gemini kamu di atas!');return;}
if(!topik){alert('Isi dulu Topiknya!');return;}
btn.disabled=true;btn.innerText='AI sedang mikir... ⏳';
hasil.innerText='Sebentar ya, AI lagi nulis caption terbaik buat kamu...';
let prompt=`Kamu adalah ahli konten viral Indonesia. Buatkan untuk platform ${platform} dengan topik: "${topik}". Buatkan: 1 JUDUL yang bikin orang penasaran, 1 CAPTION panjang yang menyentuh hati, Islami, memotivasi, gaya bahasa santai anak muda Indonesia, dan 10 HASHTAG yang relevan. Akhiri dengan ajakan untuk follow Aji Pramana.`;
let models=['gemini-3.8-flash','gemini-3.6-flash','gemini-3.5-flash-lite','gemini-2.0-flash'];
let sukses=false;
for(let m of models){
try{
let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
let data=await res.json();
if(data.candidates && data.candidates[0].content.parts[0].text){hasil.innerText=data.candidates[0].content.parts[0].text; sukses=true; break;}
}catch(e){}
}
if(!sukses){hasil.innerText='Maaf, semua model lagi sibuk. Coba lagi 1 menit ya, atau ganti kunci API baru.';}
btn.disabled=false;btn.innerText='Buat Caption AI Beneran ✨';
}
function salin(){navigator.clipboard.writeText(document.getElementById('hasil').innerText);alert('Udah ke-copy! Tinggal paste ke TikTok!');}
</script>
</body>
</html>
